<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff2f6" />
    <title>给晓雨的一封小情书</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-hearts" aria-hidden="true">
      <span>♡</span><span>♥</span><span>♡</span><span>♥</span><span>♡</span>
    </div>

    <main class="page-shell letter-shell">
      <div class="letter-stage">
        <div class="envelope-flap" aria-hidden="true"></div>

        <section class="love-card letter-card" aria-labelledby="letter-title">
          <div class="letter-heading">
            <p class="eyebrow">一封只写给晓雨的信</p>
            <div class="postmark" aria-hidden="true">
              <span>LOVE</span>
              <small>专属投递</small>
            </div>
          </div>

          <div class="heart-seal" aria-hidden="true">
            <span>♥</span>
          </div>

          <h1 class="letter-title" id="letter-title">写给晓雨</h1>

          <div class="letter-body">
            <p class="letter-salutation">亲爱的晓雨：</p>
            <p>见字如面。</p>
            <p>
              想了很久，我还是决定把这些话认真写下来。遇见你以后，我才发现，原来只是想到一个人，嘴角也会不自觉地上扬。
            </p>
            <p>
              我喜欢和你相处时那些自然又舒服的瞬间，也喜欢你认真、可爱，还有偶尔让人忍不住心动的样子。
            </p>
            <p>
              我想陪你分享每一份开心，也想在你不开心的时候安静地站在你身边。不是一时兴起，而是想把这份喜欢慢慢写进以后的日子里。
            </p>

            <div class="letter-signoff">
              <span>一个想一直陪着你的人</span>
              <strong>♡</strong>
            </div>
          </div>

          <div class="letter-divider" aria-hidden="true"><span>♥</span></div>

          <p class="letter-next-copy">还有一句最重要的话，我想单独、认真地问你。</p>
          <a class="button button-yes letter-next" href="proposal.html">
            继续看下去 <span aria-hidden="true">→</span>
          </a>
        </section>
      </div>
    </main>
  </body>
</html>
